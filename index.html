<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGROGESTION</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#0b3022">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        :root { --primary-dark: #0b3022; --bg-light: #f8fafc; }
        body { font-family: sans-serif; background-color: var(--bg-light); margin: 0; }
        
        /* DISEÑO FLEXIBLE: Se adapta a cualquier pantalla */
        .app-container { display: flex; flex-direction: row; min-height: 100vh; }
        .sidebar-cell { width: 260px; background: white; border-right: 1px solid #ddd; padding: 20px; }
        .main-cell { flex: 1; padding: 20px; overflow-x: hidden; }
        
        /* AJUSTE PARA CELULARES */
        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar-cell { width: 100%; border-right: none; border-bottom: 2px solid #ddd; }
            .kpi-grid { grid-template-columns: 1fr 1fr !important; }
            .table-responsive { display: block; width: 100%; overflow-x: auto; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar-cell">
        <div class="nav-item active" onclick="cambiarVista('dashboard')">Dashboard</div>
        </div>
    <div class="main-cell">
        <div class="table-responsive">
            <table class="table-custom">
                </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
