<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGROGESTION</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b3022">
    <link rel="apple-touch-icon" href="logo.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root { --primary-dark: #0b3022; --bg-light: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-light); margin: 0; }

        /* DISEÑO FLEXIBLE (Adiós al display: table) */
        .app-container { display: flex; min-height: 100vh; }
        .sidebar-cell { width: 260px; background: white; border-right: 1px solid #dee2e6; padding: 20px; flex-shrink: 0; }
        .main-cell { flex-grow: 1; padding: 20px; width: 100%; overflow-x: hidden; }

        /* MÓVIL: Apilamos el menú arriba */
        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar-cell { width: 100%; border-right: none; border-bottom: 1px solid #dee2e6; }
            .kpi-grid { grid-template-columns: 1fr 1fr !important; }
        }

        /* Tablas adaptables */
        .table-responsive { width: 100%; overflow-x: auto; }
        .table-custom { width: 100%; min-width: 600px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar-cell">...</div>

    <div class="main-cell">
        <div class="table-responsive">
            <table class="table-custom">...</table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
