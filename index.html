<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGROGESTION</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#0b3022">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        :root { --primary-dark: #0b3022; --bg-light: #f8fafc; }
        body { font-family: sans-serif; background-color: var(--bg-light); margin: 0; }

        /* Estructura principal moderna */
        .app-container { display: flex; min-height: 100vh; }
        .sidebar-cell { width: 260px; background: white; border-right: 1px solid #ddd; padding: 20px; flex-shrink: 0; }
        .main-cell { flex: 1; padding: 20px; overflow-x: hidden; }

        /* Adaptación a móvil: el menú va arriba */
        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar-cell { width: 100%; border-right: none; border-bottom: 2px solid #ddd; padding: 15px; }
            .main-cell { padding: 15px; }
            .table-responsive { width: 100%; overflow-x: auto; display: block; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar-cell">
        <!-- AQUÍ TU MENÚ -->
        <div class="nav-item">Dashboard</div>
        <div class="nav-item">Lotes de Tierra</div>
    </div>
    <div class="main-cell">
        <div class="table-responsive">
            <!-- AQUÍ TU TABLA -->
            <table class="table">
                <thead><tr><th>Columna</th></tr></thead>
                <tbody><tr><td>Datos</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
