<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGROGESTION - Panel Profesional</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#0b3022">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root { --primary-dark: #0b3022; --accent-green: #2d6a4f; --gold: #d4af37; --bg-light: #f8fafc; --white: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-light); color: var(--text-main); }
        
        /* Contenedor Flex para que sea adaptable */
        .app-container { display: flex; width: 100%; min-height: 100vh; }
        .sidebar-cell { width: 260px; background: var(--white); border-right: 1px solid var(--border-color); padding: 20px; flex-shrink: 0; }
        .main-cell { flex-grow: 1; padding: 40px; overflow-x: hidden; }

        /* Estilos de Tablas para Móvil */
        .table-responsive { overflow-x: auto; }
        .table-custom { width: 100%; min-width: 500px; border-collapse: collapse; }
        
        /* ADAPTACIÓN MÓVIL CRÍTICA */
        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar-cell { width: 100%; border-right: none; border-bottom: 1px solid var(--border-color); padding: 15px; }
            .main-cell { padding: 15px; }
            .kpi-grid { grid-template-columns: 1fr 1fr !important; }
            .btn-primary-custom { width: 100%; justify-content: center; margin-bottom: 10px; }
        }

        /* --- Resto de tus estilos originales sin cambios --- */
        .view-section { display: none; }
        .view-section.active-view { display: block; }
        /* ... (mantén el resto de tus clases .kpi-card, .nav-item, etc. aquí) ... */
    </style>
</head>
<body>
    <div class="app-container">
        </div>
    
    <script type="module">
        // (Toda tu lógica de Firebase y funciones que ya tienes)
    </script>
</body>
</html>
