<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGROGESTION</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* BASE FLEXIBLE */
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
        .app-container { display: flex; flex-direction: row; min-height: 100vh; }
        
        /* SIDEBAR */
        .sidebar { width: 260px; background: #fff; border-right: 1px solid #ddd; padding: 20px; flex-shrink: 0; }
        
        /* CONTENIDO */
        .main-content { flex: 1; padding: 20px; width: 100%; overflow-x: hidden; }

        /* TABLAS RESPONSIVAS */
        .table-responsive { width: 100%; overflow-x: auto; }

        /* ADAPTACIÓN MÓVIL (Aquí ocurre la magia) */
        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #ddd; padding: 10px; }
            .main-content { padding: 10px; }
            /* Hacemos que los KPI se vean bien en móvil */
            .kpi-grid { display: grid !important; grid-template-columns: 1fr 1fr; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            </div>
        <div class="main-content">
            <div class="table-responsive">
                <table class="table">...</table>
            </div>
        </div>
    </div>
</body>
</html>
